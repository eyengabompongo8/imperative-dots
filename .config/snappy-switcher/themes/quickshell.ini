# Quickshell Matugen Glass Theme for Snappy-Switcher
# Dynamically matched to ~/.config/hypr/scripts/quickshell/qs_colors.json

[colors]
# Glass panel background (Matugen base #0d0e13 with 75% alpha)
background = #0d0e13bf

# Unselected item card (subtle glass surface #1e1f25 with 60% alpha)
card_bg = #1e1f2599

# Selected active card (surface2 #34343a)
card_selected = #34343aee

# Border color (Mauve/Blue accent #b5c4ff matching Quickshell highlights)
border_color = #b5c4ffee

# Primary typography (Matugen text)
text_color = #e3e1e9ff

# Muted subtext (Matugen subtext1)
subtext_color = #8f909aff

# Context bundle stack background
bundle_bg = #1a1b21bb

# Workspace/count badge pill
badge_bg = #292a2fdd
badge_text_color = #b5c4ffff
badge_bg_selected = #b5c4ffff
badge_text_color_selected = #0d0e13ff
