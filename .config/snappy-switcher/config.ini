[general]
mode = overview
follow_monitor = true
show_workspace_badge = false
sticky_mode = false
ignore_pinned = false
ignore_special = true

[theme]
name = quickshell.ini
border_width = 1
card_border_width = 2
corner_radius = 16

[layout]
card_width = 140
card_height = 130
card_gap = 10
padding = 12
max_cols = 6
icon_size = 52
icon_radius = 12

error_width = 480
error_height = 160
error_font_size = 13

[icons]
theme = Papirus
fallback = hicolor
show_letter_fallback = true

[font]
family = SF Pro Text
weight = Medium
title_size = 11
icon_letter_size = 22
