# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

layerrule {
    name = "lr1"
    match:namespace = ^(volume_osd)$
    no_anim = on
}

layerrule {
    name = "lr2"
    match:namespace = ^(brightness_osd)$
    no_anim = on
}

layerrule {
    name = "lr3"
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = "lr4"
    match:namespace = qsdock
    no_anim = on
}

layerrule {
    name = "lr5"
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

layerrule {
    name = "lr_snappy"
    match:namespace = ^(snappy-switcher)$
    blur = on
    ignore_alpha = 0.2
}

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── App Launcher ─────────
windowrule {
    name = "app_launcher"
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

# ───────── MASTER QUICKSHELL CONTAINER ─────────
windowrule {
    name = "master_rule"
    match:title = ^(qs-master)$
    float = on
    no_shadow = on
    no_initial_focus = on
}

# ───────── SPOTIFY & DISCORD WORKSPACE ─────────

windowrule {
    name = discord-persistence
    match:class = ^(discord)$
    workspace = special:spotify_discord silent
}

windowrule {
    name = spotify-persistence
    match:class = (?i)^(spotify)$

    # Also match by title as a backup if the class isn't set yet
    match:title = (?i)^(spotify.*)$
    workspace = special:spotify_discord silent
}