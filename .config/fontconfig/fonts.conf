<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- ========================================== -->
    <!-- 1. SYSTEM TEXT OVERRIDES (SAN FRANCISCO)  -->
    <!-- ========================================== -->
    
    <!-- Set San Francisco as the preferred sans-serif font -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>SF Pro</string>
            <string>SF Pro Display</string>
            <string>SF Pro Text</string>
        </edit>
    </match>


    <!-- ========================================== -->
    <!-- 2. EMOJI OVERRIDES (APPLE COLOR EMOJI)   -->
    <!-- ========================================== -->

    <!-- Make Apple Color Emoji the preferred fallback for the generic 'emoji' family -->
    <match target="pattern">
        <test qual="any" name="family"><string>emoji</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Apple Color Emoji</string>
        </edit>
    </match>

    <!-- Force apps asking specifically for Noto to use Apple instead -->
    <match target="pattern">
        <test qual="any" name="family"><string>Noto Color Emoji</string></test>
        <edit name="family" mode="assign" binding="same">
            <string>Apple Color Emoji</string>
        </edit>
    </match>

</fontconfig>
